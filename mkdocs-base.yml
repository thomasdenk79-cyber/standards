# MkDocs Basis-Konfiguration — geerbt von allen Repos
#
# Verwendung in repo-spezifischer mkdocs.yml:
#   INHERIT: ../standards/mkdocs-base.yml
#   site_name: Mein Repo Name
#   nav:
#     - ...

# Wird von erbenden Repos überschrieben:
site_name: "Dokumentation"
site_author: Thomas Denk

use_directory_urls: true

theme:
  name: material
  language: de
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - navigation.tabs
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Helles Design
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Dunkles Design

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/thomasdenk79-cyber
      name: GitHub thomasdenk79-cyber
